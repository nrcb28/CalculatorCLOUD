name: Desktop checks and installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  rust-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --lib
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features --examples
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb dbus-x11 webkit2gtk-driver
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows NSIS
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb,appimage
      - name: Native Linux WebView and SQLite smoke
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          cargo install tauri-driver --locked --root "$RUNNER_TEMP/tauri-webdriver"
          export TAURI_DRIVER_BINARY="$RUNNER_TEMP/tauri-webdriver/bin/tauri-driver"
          export TAURI_TEST_BINARY="$PWD/src-tauri/target/release/cloudcost-compare"
          xvfb-run -a dbus-run-session -- bash scripts/native-smoke.sh
      - name: Native smoke evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-Linux
          path: |
            native-smoke.png
            tauri-driver.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: cloudcost-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
